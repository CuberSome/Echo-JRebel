[package]
name = "openidea-jrebel-integration"
version = "0.5.0"
edition = "2024"
publish = false

[workspace]
exclude = ["vendor/openidea-plugin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { path = "vendor/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
toml = "0.9"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
